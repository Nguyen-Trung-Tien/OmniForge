<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Gradients -->
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7928CA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Electric Blue to Deep Purple Gradients -->
    <linearGradient id="prismGradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <linearGradient id="prismGradientSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="60%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <linearGradient id="anvilBaseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A9E"/>
      <stop offset="50%" stop-color="#2D1152"/>
      <stop offset="100%" stop-color="#1A0B2E"/>
    </linearGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="coreEnergy" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BD00FF"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00D2FF" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#7928CA" flood-opacity="0.25"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#forgeGlow)"/>

  <!-- Geometric Layered Prism & Anvil Container -->
  <g filter="url(#dropShadow)">
    
    <!-- Anvil Base: Foundation Step 1 (Lower Pedestal) -->
    <path d="M 120 408 L 392 408 L 416 444 L 96 444 Z" 
          fill="url(#anvilBaseGradient)" 
          stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Anvil Base: Foundation Step 2 (Middle Risers) -->
    <path d="M 148 360 L 364 360 L 388 408 L 124 408 Z" 
          fill="url(#anvilBaseGradient)" 
          opacity="0.95"/>

    <!-- Anvil Waist (Central Column) -->
    <path d="M 204 290 L 308 290 L 336 360 L 176 360 Z" 
          fill="url(#prismGradientSecondary)" 
          opacity="0.85"/>

    <!-- Left Anvil Horn (Prismatic Projection) -->
    <path d="M 64 196 L 204 196 L 216 280 L 168 280 L 140 248 L 64 196 Z" 
          fill="url(#prismGradientPrimary)"/>

    <!-- Top Plate / Anvil Face (Upper Deck Facets) -->
    <!-- Facet: Main Deck Top Surface -->
    <polygon points="176,132 400,132 448,196 204,196" 
             fill="url(#prismGradientPrimary)"/>

    <!-- Facet: Right Anvil Heel / Projection -->
    <polygon points="400,132 448,196 448,272 384,288 320,288 320,240 376,224 400,196" 
             fill="url(#prismGradientSecondary)"/>

    <!-- Facet: Front Anvil Body Prism Cut -->
    <polygon points="204,196 384,196 352,284 216,280" 
             fill="url(#prismGradientPrimary)" 
             opacity="0.92"/>

    <!-- Core Geometric Prism Shard (The "Omni" Spark / Diamond Inset) -->
    <polygon points="256,152 300,216 256,280 212,216" 
             fill="url(#coreEnergy)" 
             filter="url(#glowFilter)" 
             opacity="0.95"/>

    <!-- Prismatic Reflection Overlay (Glass/Sheen lines) -->
    <polygon points="176,132 280,132 232,196 156,196" 
             fill="url(#facetHighlight)" 
             opacity="0.45"/>

    <polygon points="256,152 285,194 256,204 227,194" 
             fill="#FFFFFF" 
             opacity="0.6"/>

    <!-- Accent Linework & Cyber-Etching -->
    <path d="M 80 206 L 192 206 L 220 270" 
          fill="none" 
          stroke="#00FFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.8"/>

    <path d="M 256 120 L 256 142" 
          stroke="#00F0FF" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <path d="M 436 196 L 410 260 L 336 280" 
          fill="none" 
          stroke="#9B51E0" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.8"/>

    <!-- Base Energy Guideline -->
    <line x1="124" y1="408" x2="388" y2="408" 
          stroke="#00D2FF" 
          stroke-width="2" 
          opacity="0.7"/>
    <line x1="96" y1="444" x2="416" y2="444" 
          stroke="#7928CA" 
          stroke-width="2.5" 
          opacity="0.9"/>
  </g>
</svg>

